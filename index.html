<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>QuickNotes</h1>
    
    <button id="load-btn">Load notes</button>
    <p id="status"></p>

    <form id="note-form">
      <h2>Create a Note</h2>
      <div>
        <label for="title-input">Title (required, max 100 chars):</label>
        <input type="text" id="title-input" maxlength="100" required placeholder="Note title..." />
      </div>
      <div>
        <label for="body-input">Body (optional):</label>
        <textarea id="body-input" placeholder="Note content..."></textarea>
      </div>
      <button type="submit" id="submit-btn">Submit Note</button>
    </form>

    <h2>Notes List</h2>
    <ul id="notes-list"></ul>
  </div>
</body>
</html>
